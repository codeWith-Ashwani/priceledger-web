worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map "$status:$uri" $asset_cache {
        default "no-store";
        ~^200:/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 1500000;
        client_body_timeout 15s;
        add_header Cache-Control $asset_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

        location = /health { return 200 "ok\n"; }
        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_hide_header Cache-Control;
        }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri /index.html; }
    }
}
